name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: npm install --ignore-scripts

      - name: Build Surface Lab
        run: npm run build

      - name: Test 3MF generator with checked-in H2D template
        run: npm test

      - name: Inspect H2D template
        run: npm run test:generator
